<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="1560" version="1.1" viewBox="0 0 1460 1560" width="1460" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arrow" markerHeight="10" markerUnits="strokeWidth" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M0,0 L9,5 L0,10 z" fill="#AFAFAF" /></marker></defs><rect fill="#121212" height="1560" width="1460" x="0" y="0" /><text fill="#E6E6E6" font-family="DejaVu Sans" font-size="25px" font-weight="bold" x="45" y="52">UML · Последовательность создания заявки</text><rect fill="#95C4F2" height="62" rx="10" ry="10" stroke="#95C4F2" width="190" x="25.0" y="84" /><text fill="#111111" font-family="DejaVu Sans" font-size="17px" font-weight="bold" text-anchor="middle" x="120" y="123">Студент</text><line stroke="#AFAFAF" stroke-dasharray="6 7" stroke-width="1.4" x1="120" x2="120" y1="146" y2="1465" /><rect fill="#95C4F2" height="62" rx="10" ry="10" stroke="#95C4F2" width="230" x="330.0" y="84" /><text fill="#111111" font-family="DejaVu Sans" font-size="17px" font-weight="bold" text-anchor="middle" x="445" y="123">Telegram-бот</text><line stroke="#AFAFAF" stroke-dasharray="6 7" stroke-width="1.4" x1="445" x2="445" y1="146" y2="1465" /><rect fill="#95C4F2" height="62" rx="10" ry="10" stroke="#95C4F2" width="310" x="720.0" y="84" /><text fill="#111111" font-family="DejaVu Sans" font-size="17px" font-weight="bold" text-anchor="middle" x="875" y="123">Серверная часть (FastAPI)</text><line stroke="#AFAFAF" stroke-dasharray="6 7" stroke-width="1.4" x1="875" x2="875" y1="146" y2="1465" /><rect fill="#95C4F2" height="62" rx="10" ry="10" stroke="#95C4F2" width="190" x="1175.0" y="84" /><text fill="#111111" font-family="DejaVu Sans" font-size="17px" font-weight="bold" text-anchor="middle" x="1270" y="123">База данных</text><line stroke="#AFAFAF" stroke-dasharray="6 7" stroke-width="1.4" x1="1270" x2="1270" y1="146" y2="1465" /><rect fill="#1D8EB9" height="1292" opacity="0.7" stroke="#1D8EB9" width="36" x="856" y="158" /><line marker-end="url(#arrow)" stroke="#AFAFAF" stroke-width="1.5" x1="120" x2="445" y1="201" y2="201" /><text fill="#E6E6E6" font-family="DejaVu Sans" font-size="14px" text-anchor="middle" x="282.5" y="189">1. Выбирает технику, период и цель</text><line marker-end="url(#arrow)" stroke="#AFAFAF" stroke-width="1.5" x1="445" x2="875" y1="265" y2="265" /><text fill="#E6E6E6" font-family="DejaVu Sans" font-size="14px" text-anchor="middle" x="660.0" y="253">2. POST /bookings; данные заявки</text><path d="M 875 317 h 47 v 27 h -47" fill="none" marker-end="url(#arrow)" stroke="#AFAFAF" stroke-width="1.5" /><text fill="#E6E6E6" font-family="DejaVu Sans" font-size="14px" text-anchor="start" x="926" y="305">3. Проверяет даты и обязательные поля</text><rect fill="none" height="1000" stroke="#7E7787" stroke-width="2" width="1396" x="32" y="380" /><rect fill="#7E7787" height="28" width="325" x="33" y="381" /><text fill="#E6E6E6" font-family="DejaVu Sans" font-size="14px" x="45" y="399">Условия обработки</text><line stroke="#7E7787" stroke-dasharray="5 5" stroke-width="1" x1="35" x2="1425" y1="540" y2="540" /><rect fill="#7E7787" height="28" width="300" x="35" y="541" /><text fill="#E6E6E6" font-family="DejaVu Sans" font-size="14px" x="47" y="560">Данные корректны</text><line marker-end="url(#arrow)" stroke="#AFAFAF" stroke-dasharray="7 6" stroke-width="1.5" x1="875" x2="445" y1="453" y2="453" /><text fill="#E6E6E6" font-family="DejaVu Sans" font-size="14px" text-anchor="middle" x="660.0" y="441">4. 422 — некорректные данные</text><line marker-end="url(#arrow)" stroke="#AFAFAF" stroke-dasharray="7 6" stroke-width="1.5" x1="445" x2="120" y1="511" y2="511" /><text fill="#E6E6E6" font-family="DejaVu Sans" font-size="14px" text-anchor="middle" x="282.5" y="499">5. Предлагает исправить ввод</text><line marker-end="url(#arrow)" stroke="#AFAFAF" stroke-width="1.5" x1="875" x2="1270" y1="622" y2="622" /><text fill="#E6E6E6" font-family="DejaVu Sans" font-size="14px" text-anchor="middle" x="1072.5" y="610">6. Проверяет роль и технику</text><line marker-end="url(#arrow)" stroke="#AFAFAF" stroke-dasharray="7 6" stroke-width="1.5" x1="1270" x2="875" y1="685" y2="685" /><text fill="#E6E6E6" font-family="DejaVu Sans" font-size="14px" text-anchor="middle" x="1072.5" y="673">7. Результат проверки</text><line marker-end="url(#arrow)" stroke="#AFAFAF" stroke-width="1.5" x1="875" x2="1270" y1="748" y2="748" /><text fill="#E6E6E6" font-family="DejaVu Sans" font-size="14px" text-anchor="middle" x="1072.5" y="736">8. Проверяет лимит и просрочки</text><line marker-end="url(#arrow)" stroke="#AFAFAF" stroke-dasharray="7 6" stroke-width="1.5" x1="1270" x2="875" y1="806" y2="806" /><text fill="#E6E6E6" font-family="DejaVu Sans" font-size="14px" text-anchor="middle" x="1072.5" y="794">9. Результат проверки</text><line marker-end="url(#arrow)" stroke="#AFAFAF" stroke-width="1.5" x1="875" x2="1270" y1="866" y2="866" /><text fill="#E6E6E6" font-family="DejaVu Sans" font-size="14px" text-anchor="middle" x="1072.5" y="854">10. Проверяет пересечения периодов</text><line marker-end="url(#arrow)" stroke="#AFAFAF" stroke-dasharray="7 6" stroke-width="1.5" x1="1270" x2="875" y1="921" y2="921" /><text fill="#E6E6E6" font-family="DejaVu Sans" font-size="14px" text-anchor="middle" x="1072.5" y="909">11. Результат проверки</text><rect fill="none" height="405" stroke="#7E7787" stroke-width="2" width="1396" x="32" y="965" /><rect fill="#7E7787" height="28" width="325" x="33" y="966" /><text fill="#E6E6E6" font-family="DejaVu Sans" font-size="14px" x="45" y="984">Результат проверок</text><line stroke="#7E7787" stroke-dasharray="5 5" stroke-width="1" x1="35" x2="1425" y1="1125" y2="1125" /><rect fill="#7E7787" height="28" width="300" x="35" y="1126" /><text fill="#E6E6E6" font-family="DejaVu Sans" font-size="14px" x="47" y="1145">Проверки пройдены</text><line marker-end="url(#arrow)" stroke="#AFAFAF" stroke-dasharray="7 6" stroke-width="1.5" x1="875" x2="445" y1="1023" y2="1023" /><text fill="#E6E6E6" font-family="DejaVu Sans" font-size="14px" text-anchor="middle" x="660.0" y="1011">12. 403 / 404 / 409 — отказ</text><line marker-end="url(#arrow)" stroke="#AFAFAF" stroke-dasharray="7 6" stroke-width="1.5" x1="445" x2="120" y1="1080" y2="1080" /><text fill="#E6E6E6" font-family="DejaVu Sans" font-size="14px" text-anchor="middle" x="282.5" y="1068">13. Показывает причину</text><line marker-end="url(#arrow)" stroke="#AFAFAF" stroke-width="1.5" x1="875" x2="1270" y1="1200" y2="1200" /><text fill="#E6E6E6" font-family="DejaVu Sans" font-size="14px" text-anchor="middle" x="1072.5" y="1188">14. Сохраняет заявку и событие</text><line marker-end="url(#arrow)" stroke="#AFAFAF" stroke-dasharray="7 6" stroke-width="1.5" x1="1270" x2="875" y1="1253" y2="1253" /><text fill="#E6E6E6" font-family="DejaVu Sans" font-size="14px" text-anchor="middle" x="1072.5" y="1241">15. Идентификатор заявки</text><line marker-end="url(#arrow)" stroke="#AFAFAF" stroke-dasharray="7 6" stroke-width="1.5" x1="875" x2="445" y1="1306" y2="1306" /><text fill="#E6E6E6" font-family="DejaVu Sans" font-size="14px" text-anchor="middle" x="660.0" y="1294">16. 201 — заявка создана</text><line marker-end="url(#arrow)" stroke="#AFAFAF" stroke-dasharray="7 6" stroke-width="1.5" x1="445" x2="120" y1="1357" y2="1357" /><text fill="#E6E6E6" font-family="DejaVu Sans" font-size="14px" text-anchor="middle" x="282.5" y="1345">17. Показывает номер и статус</text><rect fill="#7E7787" height="64" rx="7" ry="7" width="1330" x="65" y="1444" /><text fill="#111111" font-family="DejaVu Sans" font-size="17px" x="87" y="1483">Целевая схема: Telegram-бот пока не реализован; API прототипа вызывается напрямую.</text></svg>